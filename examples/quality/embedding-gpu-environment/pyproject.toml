[project]
name = "digital-memory-embedding-gpu-comparison"
version = "0.1.0"
description = "Isolated CUDA environment for real EmbeddingGemma 2 retrieval evaluation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.2,<3",
  "pillow>=11,<13",
  "sentence-transformers[image]==6.1.0",
  "transformers==5.19.0",
  "torch==2.11.0",
  "torchvision==0.26.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
